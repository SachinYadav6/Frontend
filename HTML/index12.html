<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete HTML Form</title>
</head>

<body>

  <h1>Registration Form</h1>

  <form action="#" method="post">

    <!-- Basic Information -->
    <fieldset>
      <legend>Basic Information</legend>

      <label for="name">Full Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required
      />

      <br /><br />

      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="example@gmail.com"
        required
      />

      <br /><br />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        minlength="8"
        placeholder="Minimum 8 characters"
        required
      />

      <br /><br />

      <label for="phone">Phone:</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter phone number"
      />

    </fieldset>

    <br />

    <!-- Personal Details -->
    <fieldset>
      <legend>Personal Details</legend>

      <label for="age">Age:</label>
      <input
        type="number"
        id="age"
        name="age"
        min="18"
        max="100"
      />

      <br /><br />

      <label for="dob">Date of Birth:</label>
      <input
        type="date"
        id="dob"
        name="dob"
      />

      <br /><br />

      <label for="time">Preferred Time:</label>
      <input
        type="time"
        id="time"
        name="time"
      />

      <br /><br />

      <label for="appointment">Appointment:</label>
      <input
        type="datetime-local"
        id="appointment"
        name="appointment"
      />

    </fieldset>

    <br />

    <!-- Gender -->
    <fieldset>
      <legend>Gender</legend>

      <input
        type="radio"
        id="male"
        name="gender"
        value="male"
      />
      <label for="male">Male</label>

      <input
        type="radio"
        id="female"
        name="gender"
        value="female"
      />
      <label for="female">Female</label>

      <input
        type="radio"
        id="other"
        name="gender"
        value="other"
      />
      <label for="other">Other</label>

    </fieldset>

    <br />

    <!-- Skills -->
    <fieldset>
      <legend>Skills</legend>

      <input
        type="checkbox"
        id="html"
        name="skills"
        value="html"
      />
      <label for="html">HTML</label>

      <input
        type="checkbox"
        id="css"
        name="skills"
        value="css"
      />
      <label for="css">CSS</label>

      <input
        type="checkbox"
        id="javascript"
        name="skills"
        value="javascript"
      />
      <label for="javascript">JavaScript</label>

      <input
        type="checkbox"
        id="react"
        name="skills"
        value="react"
      />
      <label for="react">React</label>

    </fieldset>

    <br />

    <!-- Education -->
    <fieldset>
      <legend>Education</legend>

      <label for="education">Highest Qualification:</label>

      <select id="education" name="education">
        <option value="">Select qualification</option>
        <option value="10th">10th</option>
        <option value="12th">12th</option>
        <option value="graduation">Graduation</option>
        <option value="post-graduation">Post Graduation</option>
      </select>

    </fieldset>

    <br />

    <!-- Multiple Select -->
    <fieldset>
      <legend>Languages</legend>

      <label for="languages">Select Languages:</label>

      <select id="languages" name="languages" multiple>
        <option value="english">English</option>
        <option value="hindi">Hindi</option>
        <option value="telugu">Telugu</option>
        <option value="tamil">Tamil</option>
      </select>

    </fieldset>

    <br />

    <!-- About -->
    <fieldset>
      <legend>About You</legend>

      <label for="about">Tell us about yourself:</label>

      <br /><br />

      <textarea
        id="about"
        name="about"
        rows="6"
        cols="40"
        placeholder="Write something about yourself..."
        maxlength="500"
      ></textarea>

    </fieldset>

    <br />

    <!-- File Upload -->
    <fieldset>
      <legend>Documents</legend>

      <label for="resume">Upload Resume:</label>
      <input
        type="file"
        id="resume"
        name="resume"
        accept=".pdf,.doc,.docx"
      />

      <br /><br />

      <label for="profile">Profile Picture:</label>
      <input
        type="file"
        id="profile"
        name="profile"
        accept="image/*"
      />

    </fieldset>

    <br />

    <!-- Website -->
    <fieldset>
      <legend>Social Media</legend>

      <label for="website">Website:</label>

      <input
        type="url"
        id="website"
        name="website"
        placeholder="https://example.com"
      />

    </fieldset>

    <br />

    <!-- Preferences -->
    <fieldset>
      <legend>Preferences</legend>

      <label for="color">Favorite Color:</label>
      <input
        type="color"
        id="color"
        name="color"
        value="#000000"
      />

      <br /><br />

      <label for="experience">Experience Level:</label>
      <input
        type="range"
        id="experience"
        name="experience"
        min="0"
        max="10"
        value="5"
      />

    </fieldset>

    <br />

    <!-- Search -->
    <fieldset>
      <legend>Search</legend>

      <label for="search">Search:</label>

      <input
        type="search"
        id="search"
        name="search"
        placeholder="Search something..."
      />

    </fieldset>

    <br />

    <!-- Datalist -->
    <fieldset>
      <legend>City</legend>

      <label for="city">Select City:</label>

      <input
        list="cities"
        id="city"
        name="city"
        placeholder="Choose or type city"
      />

      <datalist id="cities">
        <option value="Delhi"></option>
        <option value="Mumbai"></option>
        <option value="Hyderabad"></option>
        <option value="Bangalore"></option>
        <option value="Chennai"></option>
      </datalist>

    </fieldset>

    <br />

    <!-- Advanced Validation -->
    <fieldset>
      <legend>Advanced Validation</legend>

      <label for="username">Username:</label>

      <input
        type="text"
        id="username"
        name="username"
        pattern="[A-Za-z0-9]{4,15}"
        title="Username must be 4-15 characters"
        required
      />

      <br /><br />

      <label for="pincode">PIN Code:</label>

      <input
        type="text"
        id="pincode"
        name="pincode"
        pattern="[0-9]{6}"
        maxlength="6"
        placeholder="6 digit PIN"
        required
      />

    </fieldset>

    <br />

    <!-- Terms -->
    <fieldset>
      <legend>Agreement</legend>

      <input
        type="checkbox"
        id="terms"
        name="terms"
        required
      />

      <label for="terms">
        I agree to the terms and conditions.
      </label>

    </fieldset>

    <br />

    <!-- Buttons -->
    <button type="submit">Submit</button>

    <button type="reset">Reset</button>

    <button type="button">Normal Button</button>

  </form>

</body>
</html>
